<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StaminaLab 360° - Plataforma de Corrida & Força</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0a0d14',
              card: '#121824',
              border: '#1e293b',
              purple: '#8b5cf6',
              cyan: '#06b6d4',
              amber: '#f59e0b',
              rose: '#f43f5e',
              emerald: '#10b981',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0a0d14;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .gradient-border {
      border: 1px solid transparent;
      background: linear-gradient(#121824, #121824) padding-box,
                  linear-gradient(135deg, rgba(6,182,212,0.4), rgba(16,185,129,0.4)) border-box;
    }
    .glass-nav {
      background: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="pb-28 pt-3 min-h-screen select-none">

  <!-- Header / App Title -->
  <header class="px-4 mb-4 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center space-x-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-emerald-500 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-bolt-lightning text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 via-emerald-400 to-amber-300 bg-clip-text text-transparent">
            StaminaLab 360°
          </h1>
          <p class="text-[10px] text-gray-400 uppercase tracking-wider font-semibold">Plataforma Científica de Corrida & Força</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="filterFavorites()" class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700 text-amber-400 hover:bg-slate-700 transition" title="Favoritos">
          <i class="fa-solid fa-star text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="relative mt-3">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </div>
      <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Pesquisar protocolos, treinos de elástico, fisiologia..." 
             class="w-full pl-10 pr-10 py-2.5 bg-slate-900/90 border border-slate-800 rounded-2xl text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/20 transition-all shadow-inner" />
      <button id="clearSearch" onclick="clearSearchInput()" class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-500 hover:text-gray-300">
        <i class="fa-solid fa-circle-xmark text-sm"></i>
      </button>
    </div>
  </header>
